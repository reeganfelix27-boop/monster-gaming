<!DOCTYPE html>
<html>
<head>
<title>Monster Snake Game</title>

<style>
body {
    background: black;
    color: #39ff14;
    text-align: center;
    font-family: Arial;
}

h1 {
    font-size: 35px;
    text-shadow: 0 0 15px #39ff14;
}

canvas {
    background: #151515;
    border: 3px solid #39ff14;
}

button {
    background: #39ff14;
    padding: 12px 25px;
    border: none;
    cursor: pointer;
    font-size: 18px;
}
</style>
</head>

<body>

<h1>🐍 MONSTER SNAKE GAME</h1>

<h2>Score: <span id="score">0</span></h2>

<canvas id="game" width="400" height="400"></canvas>

<br><br>

<button onclick="restart()">RESTART</button>

<p>Use ARROW KEYS to move</p>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let snake = [{x:200, y:200}];

let food = {x:100, y:100};

let dx = 20;
let dy = 0;

let score = 0;
let gameOver = false;

function draw() {

    ctx.fillStyle = "black";
    ctx.fillRect(0, 0, 400, 400);

    snake.forEach(part => {
        ctx.fillStyle = "#39ff14";
        ctx.fillRect(part.x, part.y, 18, 18);
    });

    ctx.fillStyle = "red";
    ctx.fillRect(food.x, food.y, 18, 18);

    if(gameOver) {
        ctx.fillStyle = "white";
        ctx.font = "30px Arial";
        ctx.fillText("GAME OVER!", 105, 200);
        return;
    }

    let head = {
        x: snake[0].x + dx,
        y: snake[0].y + dy
    };

    if(head.x < 0 || head.x >= 400 ||
       head.y < 0 || head.y >= 400) {
        gameOver = true;
        return;
    }

    if(snake.some(part =>
        part.x === head.x && part.y === head.y)) {
        gameOver = true;
        return;
    }

    snake.unshift(head);

    if(head.x === food.x && head.y === food.y) {
        score++;
        document.getElementById("score").innerText = score;

        food.x = Math.floor(Math.random()*20)*20;
        food.y = Math.floor(Math.random()*20)*20;
    } else {
        snake.pop();
    }
}

function changeDirection(e) {

    if(e.key === "ArrowUp" && dy === 0) {
        dx = 0;
        dy = -20;
    }

    if(e.key === "ArrowDown" && dy === 0) {
        dx = 0;
        dy = 20;
    }

    if(e.key === "ArrowLeft" && dx === 0) {
        dx = -20;
        dy = 0;
    }

    if(e.key === "ArrowRight" && dx === 0) {
        dx = 20;
        dy = 0;
    }
}

document.addEventListener("keydown", changeDirection);

let timer;

function startGame() {
    clearInterval(timer);
    timer = setInterval(draw, 150);
}

function restart() {
    snake = [{x:200, y:200}];
    food = {x:100, y:100};
    dx = 20;
    dy = 0;
    score = 0;
    gameOver = false;

    document.getElementById("score").innerText = score;

    startGame();
}

startGame();

</script>

</body>
</html>
