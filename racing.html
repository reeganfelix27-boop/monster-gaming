<!DOCTYPE html>
<html>
<head>
<title>Monster Racing</title>

<style>
body {
    background: black;
    color: #39ff14;
    text-align: center;
    font-family: Arial;
}

h1 {
    text-shadow: 0 0 15px #39ff14;
}

canvas {
    background: #333;
    border: 4px solid #39ff14;
}

button {
    background: #39ff14;
    padding: 12px 25px;
    font-size: 18px;
    cursor: pointer;
}
</style>
</head>

<body>

<h1>🏎️ MONSTER RACING</h1>

<h2>Score: <span id="score">0</span></h2>

<canvas id="game" width="400" height="500"></canvas>

<br><br>

<button onclick="restart()">RESTART</button>

<p>Use LEFT and RIGHT arrow keys to drive.</p>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let car = {x:180, y:400, width:40, height:70};
let enemy = {x:100, y:-100, width:40, height:70};

let score = 0;
let speed = 4;
let gameOver = false;

document.addEventListener("keydown", function(e) {
    if(e.key === "ArrowLeft" && car.x > 0)
        car.x -= 25;

    if(e.key === "ArrowRight" && car.x < 360)
        car.x += 25;
});

function drawCar(x,y,color) {
    ctx.fillStyle = color;
    ctx.fillRect(x,y,40,70);

    ctx.fillStyle = "white";
    ctx.fillRect(x+7,y+10,26,12);
    ctx.fillRect(x+7,y+48,26,12);
}

function draw() {

    ctx.fillStyle = "#333";
    ctx.fillRect(0,0,400,500);

    ctx.fillStyle = "white";

    for(let i=0;i<500;i+=100) {
        ctx.fillRect(195,i+score*speed%100,10,50);
    }

    drawCar(car.x,car.y,"#39ff14");

    if(!gameOver) {

        enemy.y += speed;

        drawCar(enemy.x,enemy.y,"red");

        if(enemy.y > 500) {
            enemy.y = -100;
            enemy.x = Math.floor(Math.random()*9)*40;
            score++;
            document.getElementById("score").innerText = score;
        }

        if(
            car.x < enemy.x+40 &&
            car.x+40 > enemy.x &&
            car.y < enemy.y+70 &&
            car.y+70 > enemy.y
        ) {
            gameOver = true;
        }

    } else {

        ctx.fillStyle = "white";
        ctx.font = "35px Arial";
        ctx.fillText("GAME OVER!",85,250);

    }

}

let timer;

function start() {
    clearInterval(timer);
    timer = setInterval(draw,30);
}

function restart() {
    car.x = 180;
    enemy.x = 100;
    enemy.y = -100;
    score = 0;
    speed = 4;
    gameOver = false;

    document.getElementById("score").innerText = 0;

    start();
}

start();

</script>

</body>
</html>
